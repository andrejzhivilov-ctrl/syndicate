# Trainer on Hermes. No provider key and no internet here: docs/HERMES_ROLLOUT.md.
model:
  provider: custom
  default: syndicate-chat
  base_url: http://eva-agent:8000/hermes/trainer/llm/chat/v1
  api_key: ${SYNDICATE_TOKEN}
  context_length: 200000

# Only memory, own skills, session search and our MCP gateway. Terminal, files, web and
# code execution stay off, so the rights checked by the gateway cannot be bypassed.
platform_toolsets:
  api_server: [memory, skills, session_search, mcp-syndicate]
agent:
  max_turns: 12
  disabled_toolsets: [terminal, file, web, browser, code_execution, delegation, cronjob, computer_use, image_gen, video_gen, tts, vision, x_search]
mcp_servers:
  syndicate:
    url: http://eva-agent:8000/hermes/trainer/mcp
    headers:
      Authorization: Bearer ${SYNDICATE_TOKEN}
    timeout: 120

# Learning is automatic: memory is written without asking, a new skill waits for Andrii.
memory:
  memory_enabled: true
  user_profile_enabled: true
  write_approval: false
  nudge_interval: 20
skills:
  write_approval: true
  creation_nudge_interval: 25
curator:
  enabled: true
  consolidate: false

# Background review goes through the budgeted learning door on the cheapest model.
auxiliary:
  background_review:
    provider: custom
    model: syndicate-learning
    base_url: http://eva-agent:8000/hermes/trainer/llm/learning/v1
    api_key: ${SYNDICATE_TOKEN}
  compression:
    provider: custom
    model: syndicate-learning
    base_url: http://eva-agent:8000/hermes/trainer/llm/learning/v1
    api_key: ${SYNDICATE_TOKEN}
  title_generation:
    enabled: false

security:
  allow_lazy_installs: false

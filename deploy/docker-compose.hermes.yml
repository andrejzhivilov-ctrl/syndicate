  # The agents' code sandbox (19.11.2026): run_python goes here. No secrets, no env file, no volumes,
  # only the internal hermes_net (no route out), read-only, unprivileged, with time and memory caps.
  code-sandbox:
    build: ./sandbox
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m
    networks:
      - hermes_net
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 128

networks:
  hermes_net:
    external: true
    name: syndicate_hermes_net

volumes:
  trainer_hermes_data: {}
  sam_hermes_data: {}

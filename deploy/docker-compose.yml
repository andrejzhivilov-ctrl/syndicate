version: "3.9"

# ===========================================================
# EVA SYNDICATE — Docker Compose v2.0 (Production-Ready)
# Contabo VPS: 12 vCPU / 48GB RAM / 400GB SSD / Ubuntu 24.04
# ВИПРАВЛЕННЯ v2.0:
#   ✅ Vault → PRODUCTION mode (Shamir unseal, ніякого dev mode)
#   ✅ N8N порт прибрано (expose тільки всередині syndicate-internal)
#   ✅ Без Docker socket у будь-якому агенті
#   ✅ Phase 1: тільки 3 агенти (EVA + MARSHAL + ARCHITECT)
# ===========================================================

x-agent-security: &agent-security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  restart: unless-stopped

networks:
  syndicate-internal:
    driver: bridge
    internal: true          # ІЗОЛЬОВАНА — агенти не мають прямого виходу в інтернет
  syndicate-edge:
    driver: bridge          # ТІЛЬКИ для Nginx ↔ зовнішній світ

volumes:
  postgres-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/postgres   # Монтуємо на LUKS-зашифрований volume хоста
  redis-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/redis
  vault-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/vault
  vault-logs:
  n8n-data:
  eva-workspace:
  nginx-certs:

services:

  # ─────────────────────────────────────────────
  # 1. POSTGRESQL + PGVECTOR (Довгострокова пам'ять)
  # Шифрування at-rest: LUKS на /data/postgres (рівень хоста)
  # pg_crypto — тільки для окремих чутливих полів поверх LUKS
  # ─────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: syndicate-postgres
    <<: *agent-security
    read_only: false
    user: "999:999"
    environment:
      POSTGRES_DB: syndicate
      POSTGRES_USER: syndicate_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - syndicate-internal
    # ЖОДНОГО відкритого порту назовні
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syndicate_user -d syndicate"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

  # ─────────────────────────────────────────────
  # 2. REDIS (Сесійна пам'ять + черги задач)
  # Шифрування at-rest: LUKS на /data/redis (рівень хоста)
  # AOF = формат персистентності, НЕ шифрування (роз'яснення у MARSHAL_SPEC)
  # ─────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: syndicate-redis
    <<: *agent-security
    read_only: false
    user: "999:999"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis-data:/data
    networks:
      - syndicate-internal
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "0.5"

  # ─────────────────────────────────────────────
  # 3. HASHICORP VAULT — PRODUCTION MODE
  # ⚠️ ВИПРАВЛЕНО: dev mode видалено повністю
  # Режим: file storage + Shamir 3-of-5 unsealing
  # Unseal keys зберігаються ОФЛАЙН (USB Андрія)
  # ─────────────────────────────────────────────
  vault:
    image: hashicorp/vault:1.17
    container_name: syndicate-vault
    <<: *agent-security
    read_only: false
    user: "100:1000"
    cap_add:
      - IPC_LOCK           # Запобігає swap пам'яті з секретами на диск
    environment:
      VAULT_ADDR: "http://0.0.0.0:8200"
      VAULT_API_ADDR: "http://vault:8200"
      # НЕ ВСТАНОВЛЮВАТИ VAULT_DEV_ROOT_TOKEN_ID — це production mode
    volumes:
      - vault-data:/vault/data
      - vault-logs:/vault/logs
      - ./config/vault/vault.hcl:/vault/config/vault.hcl:ro
    networks:
      - syndicate-internal
    command: server
    # Після першого запуску обов'язково виконати vault_init.sh:
    # - vault operator init -key-shares=5 -key-threshold=3
    # - vault operator unseal KEY_1 (3 рази з різними ключами)
    # - Зберегти всі 5 ключів + root token ОФЛАЙН
    healthcheck:
      test: >
        CMD-SHELL vault status -address=http://127.0.0.1:8200 |
        grep -q "Sealed.*false" || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # ─────────────────────────────────────────────
  # 4. N8N (Автоматизація Синдикату)
  # ⚠️ ВИПРАВЛЕНО: ports → expose (внутрішня мережа тільки)
  # Зовні доступний ВИКЛЮЧНО через Nginx reverse proxy
  # ─────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:1.65.2
    container_name: syndicate-n8n
    <<: *agent-security
    read_only: false
    user: "1000:1000"
    expose:
      - "5678"             # ⚠️ expose НЕ ports — тільки всередині Docker мережі
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: syndicate
      DB_POSTGRESDB_USER: syndicate_user
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_RESTRICT_FILE_ACCESS_TO: /home/node/.n8n/
      N8N_BLOCK_SHELL_COMMANDS: "true"
      N8N_SECURITY_AUDIT_LOGS: "true"
      WEBHOOK_URL: https://${N8N_DOMAIN}/
      N8N_HOST: ${N8N_DOMAIN}
      N8N_PROTOCOL: https
      GENERIC_TIMEZONE: Europe/Kyiv
      TZ: Europe/Kyiv
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - syndicate-internal    # Внутрішня мережа для БД
      - syndicate-edge        # Edge мережа для webhook'ів через Nginx
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"

  # ─────────────────────────────────────────────
  # 5. NGINX (Єдина точка входу — Reverse Proxy + TLS)
  # Приймає весь зовнішній трафік, проксіює до N8N
  # ─────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: syndicate-nginx
    <<: *agent-security
    read_only: false
    user: "101:101"
    ports:
      - "80:80"      # Redirect HTTP → HTTPS
      - "443:443"    # HTTPS (через Cloudflare проксі)
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx-certs:/etc/letsencrypt:ro
    networks:
      - syndicate-edge     # Тільки edge — Nginx не бачить внутрішні сервіси напряму
    depends_on:
      - n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # ─────────────────────────────────────────────
  # 6. EVA AGENT — Phase 1 (Головний агент)
  # ⚠️ БЕЗ Docker socket — жодного /var/run/docker.sock
  # Керування контейнерами — через Docker API over TLS (окремий sidecar)
  # ─────────────────────────────────────────────
  eva:
    image: syndicate/eva:0.1.0
    container_name: syndicate-eva
    <<: *agent-security
    user: "1001:1001"
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=100m
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_ROLE_ID: ${EVA_VAULT_ROLE_ID}
      VAULT_SECRET_ID: ${EVA_VAULT_SECRET_ID}
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      N8N_WEBHOOK_BASE: http://n8n:5678
      TZ: Europe/Kyiv
      # AGENT_MODE: phase1 (тільки Telegram + N8N + АРХІВ в Phase 1)
      AGENT_PHASE: "1"
    volumes:
      - eva-workspace:/data/workspace:rw
      - ./eva_core:/app/persona:ro
      # ⚠️ НЕ МОНТУВАТИ: /var/run/docker.sock — контейнер-ескейп!
    networks:
      - syndicate-internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy
      n8n:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "3.0"

# ─────────────────────────────────────────────
# PHASE 1 — 3 АГЕНТИ АКТИВНІ:
# ЄВА (eva) — головний агент, Telegram, N8N оркестрація
# МАРШАЛ — запускається як окремий моніторинг-процес всередині eva
#           або як легкий sidecar (marshal-sidecar) — Phase 2
# АРХІТЕКТОР — запускається on-demand через N8N cron (Phase 2)
#
# FIN та DOC — у Phase 1 це N8N workflows (cron + webhook),
#              повноцінні агент-контейнери у Phase 2
# ─────────────────────────────────────────────

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt

# ─────────────────────────────────────────────
# ПОРЯДОК ЗАПУСКУ (перший раз):
# 1. sudo bash server_bootstrap.sh
# 2. Підготувати LUKS volumes: sudo ./scripts/setup_luks.sh
# 3. cp .env.example .env && nano .env
# 4. docker compose up -d postgres redis vault nginx
# 5. sudo ./scripts/vault_init.sh  ← Shamir init, зберегти ключі ОФЛАЙН!
# 6. docker compose up -d n8n
# 7. docker compose up -d eva
# 8. docker compose ps  ← перевірка статусу
# ─────────────────────────────────────────────

# SYNDICATE — Production Docker Compose (v4.1 Verified)
# Fixes applied:
# - Separated db_net (internal: true for Postgres & Redis isolation) from backend (egress-enabled for API/Vault/Whisper)
# - Mounted 01-init.sql, 02-migration_v4.sql and 03-migration_v5 (embedding dimension) into Postgres initialization
# - Pinned n8n image (1.68.0) on its own subdomain (N8N_PATH=/), disabled executeCommand/ssh nodes
# - Unified Nginx certificate mount (/data/nginx-certs:/etc/nginx/certs) with automatic self-signed bootstrap
# - Garage v2.4.1 for the directors' working files: internal S3, bucket and key per director

networks:
  db_net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.19.0.0/24
  backend:
    driver: bridge
    internal: false
    ipam:
      config:
        - subnet: 172.20.0.0/24
  frontend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/24

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_ROOT:-/data}/postgres
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_ROOT:-/data}/redis
  vault_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_ROOT:-/data}/vault
  n8n_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_ROOT:-/data}/n8n
  whisper_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_ROOT:-/data}/whisper
  embeddings_data:
    # Model weights (~2 GB) are downloaded once and survive restarts.
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_ROOT:-/data}/embeddings
  eva_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_ROOT:-/data}/eva
  garage_meta:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_ROOT:-/data}/garage/meta
  garage_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_ROOT:-/data}/garage/data

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    user: "999:999"
    networks:
      - db_net
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./config/postgres/migration_v4.sql:/docker-entrypoint-initdb.d/02-migration_v4.sql:ro
      - ./config/postgres/migration_v5_embeddings_1024.sql:/docker-entrypoint-initdb.d/03-migration_v5.sql:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-syndicate}
      POSTGRES_USER: ${POSTGRES_USER:-eva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eva} -d ${POSTGRES_DB:-syndicate}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - DAC_OVERRIDE

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    user: "999:999"
    networks:
      - db_net
    environment:
      # Injected here and consumed by the command below. The password is never
      # written into config/redis/redis.conf: no placeholder to "sync", no
      # secret at rest in the repository, and no way for the file and .env to
      # drift apart. Compose refuses to start if it is unset.
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    volumes:
      - redis_data:/data
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command:
      - sh
      - -c
      - exec redis-server /usr/local/etc/redis/redis.conf --requirepass "$$REDIS_PASSWORD"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  vault:
    image: hashicorp/vault:1.15
    restart: unless-stopped
    user: "100:1000"
    networks:
      - backend
    ports:
      - "127.0.0.1:8200:8200"
    volumes:
      - vault_data:/vault/data
      - ./config/vault/vault.hcl:/vault/config/vault.hcl:ro
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"
      VAULT_API_ADDR: "http://0.0.0.0:8200"
      VAULT_CLUSTER_ADDR: "http://vault:8201"
    entrypoint: ["vault", "server", "-config=/vault/config/vault.hcl"]
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8200/v1/sys/health?sealedcode=200&uninitcode=200"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Drop everything, then hand back only IPC_LOCK: Vault needs mlock so its
    # memory is never swapped to disk. The previous version kept the whole
    # default capability set, unlike every other service in this file.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  embeddings:
    # Self-hosted vector model (BGE-M3, 1024 dims) so memory text never leaves
    # the server. Deliberately NOT in eva-agent's depends_on: vector search is an
    # enhancement, and a cold model must not block the agent from starting.
    build:
      context: .
      dockerfile: deploy/docker/embeddings.Dockerfile
    restart: unless-stopped
    user: "1001:1001"
    networks:
      - backend
    volumes:
      - embeddings_data:/app/model_cache
    environment:
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-BAAI/bge-m3}
      EMBEDDINGS_EXPECTED_DIM: "1024"
      EMBEDDINGS_TOKEN: ${EMBEDDINGS_TOKEN:-}
      EMBEDDINGS_MAX_BATCH: "64"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # No curl/wget in the slim image, so the check runs in Python. Reports
      # unhealthy while the model is still loading — which is the truth.
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request
          try:
              ok = urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=10).status == 200
          except Exception:
              ok = False
          raise SystemExit(0 if ok else 1)
      interval: 30s
      timeout: 15s
      retries: 5
      # Generous: the first start downloads the weights.
      start_period: 300s

  eva-agent:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.agent
    command: ["uvicorn", "runtime.agent_runner:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app
    restart: unless-stopped
    user: "1001:1001"
    networks:
      - db_net
      - backend
    volumes:
      # NOTE: a service must declare ``volumes`` exactly once — a second key
      # silently replaces the first and drops these mounts.
      - ./deploy/runtime:/app/runtime:ro
      - ./src:/app/src:ro
      # Regulations change without an image rebuild, like src (a stale copy kept "Obsidian: not connected").
      - ./config/agent_specs:/app/config/agent_specs:ro
      - ./static/cockpit.html:/app/cockpit.html:ro
      - eva_data:/data/eva
      # Andrii's Obsidian Second Brain, synced to his PC and phone by Syncthing
      # (uid 1001 on both sides). Eva writes Inbox/Thoughts and reports here.
      - /data/obsidian_vault:/data/obsidian
    environment:
      APP_ENV: ${APP_ENV:-production}
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
      VAULT_ROLE_ID: ${VAULT_ROLE_ID:?VAULT_ROLE_ID required}
      VAULT_SECRET_ID: ${VAULT_SECRET_ID:?VAULT_SECRET_ID required}
      EVA_API_KEY: ${EVA_API_KEY:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-syndicate}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # The container root filesystem is read-only; every writable artefact
      # (Markdown vault, rendered media, browser profiles) lives under EVA_DATA_DIR.
      EVA_DATA_DIR: /data/eva
      OBSIDIAN_VAULT_DIR: /data/obsidian
      # Vector search. Unset EMBEDDINGS_URL disables semantic search cleanly —
      # episodic memory keeps working, which is a supported mode, not a failure.
      EMBEDDINGS_URL: ${EMBEDDINGS_URL:-http://embeddings:8000}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-bge-m3}
      EMBEDDINGS_DIM: "1024"
      EMBEDDINGS_TOKEN: ${EMBEDDINGS_TOKEN:-}
      # Optional Alice worker bridge. The worker remains dormant unless both
      # the host profile and a separately gated Alice deployment are enabled.
      ALICE_WORKER_ENABLED: ${ALICE_WORKER_ENABLED:-false}
      ALICE_WORKER_URL: ${ALICE_WORKER_URL:-http://alice-agent:8000}
      ALICE_COORDINATOR_ACTIONS: ${ALICE_COORDINATOR_ACTIONS:-capabilities}
    read_only: true
    tmpfs:
      - /tmp:size=128m,uid=1001,gid=1001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:2.45.6
    restart: unless-stopped
    user: "1000:1000"
    networks:
      - db_net
      - backend
      - frontend
    volumes:
      - n8n_data:/home/node/.n8n
    environment:
      N8N_PROTOCOL: "https"
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: "5678"
      # n8n has its own subdomain (nginx proxies it at "/"). With N8N_PATH=/n8n/ the
      # editor asked for /n8n/assets/* while n8n serves /assets/*: a blank page.
      N8N_PATH: "/"
      N8N_EDITOR_BASE_URL: https://${N8N_HOST:-localhost}/
      WEBHOOK_URL: https://${N8N_HOST:-localhost}/
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      NODES_EXCLUDE: "[\"n8n-nodes-base.executeCommand\",\"n8n-nodes-base.ssh\"]"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY required}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${N8N_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-eva}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  whisper:
    build:
      context: .
      dockerfile: deploy/docker/whisper.Dockerfile
    restart: unless-stopped
    user: "1000:1000"
    networks:
      - backend
    volumes:
      - whisper_data:/app/model_cache
    environment:
      ASR_MODEL: ${ASR_MODEL:-large-v3}
      ASR_QUANTIZATION: ${ASR_QUANTIZATION:-int8}
      ASR_THREADS: ${ASR_THREADS:-2}
      HF_HOME: /app/model_cache
      PORT: "9000"
    deploy:
      resources:
        limits:
          memory: 3g
          cpus: "2.0"
        reservations:
          memory: 2g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  garage:
    # Directors' working files (S3). Internal only: no published port, no nginx
    # route. Each director has its own bucket and key (Vault agents/<id>/storage).
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    networks:
      - backend
    volumes:
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
      - ./config/garage/garage.toml:/etc/garage.toml:ro
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?GARAGE_RPC_SECRET required}
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    networks:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/usr/share/nginx/static:ro
      - ${DATA_ROOT:-/data}/nginx-certs:/etc/nginx/certs
    command: ["nginx", "-g", "daemon off;"]
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - DAC_OVERRIDE
      - CHOWN
      - SETUID
      - SETGID
    depends_on:
      - eva-agent
      - n8n

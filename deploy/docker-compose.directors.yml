services:
  oscar-agent:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.director
    profiles:
    - directors
    restart: unless-stopped
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
    environment:
      SYNDICATE_DIRECTOR_ID: oscar
      SYNDICATE_DIRECTOR_ACTIONS: ${OSCAR_ACTIONS:-capabilities}
      EVA_DATA_DIR: /data/director
      VAULT_ADDR: ${VAULT_ADDR:?set reachable Vault URL}
      VAULT_ROLE_ID: ${OSCAR_VAULT_ROLE_ID:?set oscar AppRole}
      VAULT_SECRET_ID: ${OSCAR_VAULT_SECRET_ID:?set oscar SecretID}
      SYNDICATE_DIRECTOR_PROVIDERS: ${OSCAR_PROVIDERS:-}
    volumes:
    - oscar_data:/data/director
    networks:
    - oscar_control
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    ulimits:
      nofile:
        soft: 1024
        hard: 2048
  tyler-agent:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.director
    profiles:
    - directors
    restart: unless-stopped
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
    environment:
      SYNDICATE_DIRECTOR_ID: tyler
      SYNDICATE_DIRECTOR_ACTIONS: ${TYLER_ACTIONS:-capabilities}
      EVA_DATA_DIR: /data/director
      VAULT_ADDR: ${VAULT_ADDR:?set reachable Vault URL}
      VAULT_ROLE_ID: ${TYLER_VAULT_ROLE_ID:?set tyler AppRole}
      VAULT_SECRET_ID: ${TYLER_VAULT_SECRET_ID:?set tyler SecretID}
      SYNDICATE_DIRECTOR_PROVIDERS: ${TYLER_PROVIDERS:-}
    volumes:
    - tyler_data:/data/director
    networks:
    - tyler_control
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    ulimits:
      nofile:
        soft: 1024
        hard: 2048
  jack-agent:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.director
    profiles:
    - directors
    restart: unless-stopped
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
    environment:
      SYNDICATE_DIRECTOR_ID: jack
      SYNDICATE_DIRECTOR_ACTIONS: ${JACK_ACTIONS:-capabilities}
      EVA_DATA_DIR: /data/director
      VAULT_ADDR: ${VAULT_ADDR:?set reachable Vault URL}
      VAULT_ROLE_ID: ${JACK_VAULT_ROLE_ID:?set jack AppRole}
      VAULT_SECRET_ID: ${JACK_VAULT_SECRET_ID:?set jack SecretID}
      SYNDICATE_DIRECTOR_PROVIDERS: ${JACK_PROVIDERS:-}
    volumes:
    - jack_data:/data/director
    networks:
    - jack_control
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    ulimits:
      nofile:
        soft: 1024
        hard: 2048
  antigravity-agent:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.director
    profiles:
    - directors
    restart: unless-stopped
    read_only: false
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:rw,nosuid,size=256m
    environment:
      SYNDICATE_DIRECTOR_ID: antigravity
      SYNDICATE_DIRECTOR_ACTIONS: ${ANTIGRAVITY_ACTIONS:-capabilities}
      EVA_DATA_DIR: /data/director
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
      VAULT_ROLE_ID: ${ANTIGRAVITY_VAULT_ROLE_ID:-}
      VAULT_SECRET_ID: ${ANTIGRAVITY_VAULT_SECRET_ID:-}
      SYNDICATE_DIRECTOR_PROVIDERS: ${ANTIGRAVITY_PROVIDERS:-}
    volumes:
    - antigravity_data:/data/director
    networks:
    - antigravity_control
    mem_limit: 1536m
    cpus: 1.5
    pids_limit: 256
    ulimits:
      nofile:
        soft: 2048
        hard: 4096
networks:
  oscar_control:
    driver: bridge
  tyler_control:
    driver: bridge
  jack_control:
    driver: bridge
  antigravity_control:
    driver: bridge
volumes:
  oscar_data: {}
  tyler_data: {}
  jack_data: {}
  antigravity_data: {}

services:
  oscar-agent:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.director
    profiles:
    - directors
    restart: unless-stopped
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
    environment:
      SYNDICATE_DIRECTOR_ID: oscar
      SYNDICATE_DIRECTOR_ACTIONS: ${OSCAR_ACTIONS:-capabilities}
      EVA_DATA_DIR: /data/director
      VAULT_ADDR: ${VAULT_ADDR:?set reachable Vault URL}
      VAULT_ROLE_ID: ${OSCAR_VAULT_ROLE_ID:?set oscar AppRole}
      VAULT_SECRET_ID: ${OSCAR_VAULT_SECRET_ID:?set oscar SecretID}
      SYNDICATE_DIRECTOR_PROVIDERS: ${OSCAR_PROVIDERS:-}
    volumes:
    - oscar_data:/data/director
    networks:
    - oscar_control
    - syndicate_backend
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    ulimits:
      nofile:
        soft: 1024
        hard: 2048


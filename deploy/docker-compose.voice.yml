# ==============================================================================
# SYNDICATE — Zero-Token Real-Time Voice & Second Brain Stack (Contabo VPS 12)
# Target Hardware: Contabo Cloud VPS 12 (12 vCPU, 48 GB RAM, 400 GB NVMe/SSD)
# Corporate Domain: syndicateholding.com
# ==============================================================================

services:
  livekit-server:
    image: livekit/livekit-server:v1.7
    container_name: syndicate-livekit
    restart: unless-stopped
    ports:
      # 7880 (signalling) is reached through nginx over TLS; never publish it.
      - "127.0.0.1:7880:7880/tcp"
      # WebRTC media must be reachable by clients: TCP fallback + UDP.
      - "7881:7881/tcp"
      - "7882:7882/udp"
    # nginx proxies voice.<domain> to syndicate-livekit:7880 over this network.
    # Without it a recreate silently drops LiveKit out of nginx's reach.
    networks:
      - default
      - syndicate_frontend
    environment:
      # No default key pair: a stack that boots with devkey/secret lets anyone
      # mint a valid room token. Compose refuses to start without real values
      # (generate: openssl rand -hex 16 / openssl rand -hex 32).
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET}"
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  kokoro-tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.2.2
    container_name: syndicate-kokoro-tts
    restart: unless-stopped
    ports:
      - "127.0.0.1:8880:8880"
    environment:
      - ONNX_NUM_THREADS=2
      - DEFAULT_VOICE=af_bella
    volumes:
      - /data/voices/kokoro:/app/voices:ro
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M

  voice-cloner:
    image: ghcr.io/swivid/f5-tts:latest
    container_name: syndicate-voice-cloner
    profiles:
      - f5-clone
    restart: unless-stopped
    expose:
      - "8881"
    volumes:
      - /data/voices/clones:/data/voices/clones:ro
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3072M

  pronunciation-coach:
    image: python:3.11-slim
    container_name: syndicate-pronunciation-coach
    restart: unless-stopped
    working_dir: /app
    # Disabled by default. The module is a placeholder (no acoustic model), so it
    # must not run as a service until a real scorer is wired in; and the old
    # `pip install` at container start pulled unpinned code at every boot.
    profiles:
      - pronunciation-coach-experimental
    command: ["python", "-m", "src.voice.pronunciation_coach"]
    volumes:
      - ../src:/app/src:ro
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M

  obsidian-syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    container_name: syndicate-obsidian-sync
    restart: unless-stopped
    volumes:
      - /data/obsidian_vault:/data/Second_Brain
      - /data/syncthing_config:/config
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Kyiv
    ports:
      # Sync protocol: bind to the server's Tailscale IP (SYNCTHING_BIND_IP=100.x.y.z).
      # Docker-published ports bypass UFW, so "allow only from my devices" cannot be
      # enforced with UFW alone; binding to 127.0.0.1 (the default) keeps it closed.
      - "${SYNCTHING_BIND_IP:-127.0.0.1}:22000:22000/tcp"
      - "${SYNCTHING_BIND_IP:-127.0.0.1}:22000:22000/udp"
      # Web GUI: loopback only — reach it with `ssh -L 8384:127.0.0.1:8384 server`.
      # Set a GUI password on first login.
      - "127.0.0.1:8384:8384/tcp"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

networks:
  # Created by the main stack (docker-compose.yml, project "syndicate").
  syndicate_frontend:
    external: true

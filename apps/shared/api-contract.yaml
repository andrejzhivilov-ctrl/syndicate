  /execute/stream:
    post:
      description: "Execute an agent task, streaming progress as Server-Sent Events.\n\
        \n``POST /execute`` blocks for the whole run (10-60 s is normal). A mobile\n\
        client on a flaky connection sees nothing during that time — no progress,\n\
        no proof the server is alive, and proxies may time out. This endpoint\nstreams\
        \ instead:\n\n    event: accepted   -> {\"task_id\": ...}            (immediately)\n\
        \    event: heartbeat  -> {\"elapsed_seconds\": N}      (every ~15 s)\n  \
        \  event: progress   -> interim state               (not yet available)\n\
        \    event: result     -> final payload               (terminal)\n    event:\
        \ error      -> {\"detail\": ...}             (terminal)\n    event: done\
        \       -> {\"status\": ...}             (always last)\n\nHonest limitation:\
        \ the orchestrator exposes only ``ainvoke`` (one\n``await`` for the entire\
        \ graph), so there is no interim state to emit yet.\nHeartbeats are therefore\
        \ **liveness only** — they prove the server is\nstill working, they do not\
        \ report agent progress. No synthetic progress\nevents are invented. Once\
        \ the graph is switched to ``astream_events``,\n``event: progress`` will carry\
        \ real per-node updates without any change\nto this wire format.\n\nRequires\
        \ the client to send ``POST``; browsers' ``EventSource`` is GET-only,\nso\
        \ JS callers use ``fetch`` + a stream reader. Native clients (Flutter,\nSwift,\
        \ Kotlin) read the chunked body directly."
      operationId: execute_task_stream_execute_stream_post
      parameters:
      - in: header
        name: X-API-Key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - in: header
        name: Authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Execute Task Stream

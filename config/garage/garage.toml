# Garage — lightweight S3 storage for the directors' working files (one node).
#
# The only secret, GARAGE_RPC_SECRET, comes from .env. Only the internal `backend`
# network reaches it; nginx does not proxy it and no port is published.
# No [admin] HTTP API on purpose: tools/garage_setup.py administers it with
# `garage json-api` over the encrypted RPC, so no admin token exists to leak.

replication_factor = 1
db_engine = "lmdb"
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
metadata_auto_snapshot_interval = "6h"
compression_level = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
api_bind_addr = "[::]:3900"
s3_region = "garage"
root_domain = ".s3.garage.internal"

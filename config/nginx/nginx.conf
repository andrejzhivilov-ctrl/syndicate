# SYNDICATE — Nginx Reverse Proxy Configuration (v4.1 Verified)
# Security-hardened, SSL-ready, zero undefined variables (passes `nginx -t` out of the box)

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=webhook:10m rate=100r/m;

    # Upstream definitions
    upstream eva_agent {
        server eva-agent:8000;
        keepalive 32;
    }

    upstream n8n_backend {
        server n8n:5678;
        keepalive 16;
    }

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # Main HTTPS server
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # Unified certificate path mounted from /data/nginx-certs/live/default
        ssl_certificate /etc/nginx/certs/live/default/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/live/default/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        add_header Strict-Transport-Security "max-age=63072000" always;

        # Telegram & n8n webhook endpoint (HMAC validated by agent_runner)
        location /webhook/ {
            limit_req zone=webhook burst=20 nodelay;
            proxy_pass http://eva_agent/webhook/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }

        # SYNDICATE API endpoint (protected by X-API-Key / Bearer authentication in agent_runner)
        location /api/ {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://eva_agent/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # n8n workflows (subpath /n8n/ with WebSocket support)
        location /n8n/ {
            proxy_pass http://n8n_backend/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        # Cockpit's static images contain no private data and are served
        # separately; the HTML itself must go through the agent's read-scope
        # authentication dependency below.
        location /assets/ {
            alias /usr/share/nginx/static/assets/;
            expires 7d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Executive cockpit UI. Proxy to FastAPI so the page is protected by a
        # master key or a read-scoped device token (Bearer/X-API-Key, or HTTP
        # Basic for browser navigation: username "device", password = token).
        location = /cockpit {
            proxy_pass http://eva_agent/cockpit;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-API-Key $http_x_api_key;
            proxy_read_timeout 30s;
        }
        location = /cockpit/ {
            return 301 /cockpit;
        }
        # Do not allow the old static alias to bypass auth via /cockpit/foo.
        location /cockpit/ {
            return 404;
        }

        # The public app path for the floor registry is protected by the same
        # read-scope dependency as the direct FastAPI route.
        location = /floors {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://eva_agent/floors;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-API-Key $http_x_api_key;
            proxy_read_timeout 30s;
        }

        # Health check (public liveness probe)
        location /health {
            proxy_pass http://eva_agent/health;
            access_log off;
        }

        # Block access to hidden files
        location ~ /\. {
            deny all;
        }
    }
}

# SYNDICATE — Nginx Reverse Proxy Configuration (v5.0 pre-deploy)
# Routing: Cockpit + agent API (apex), n8n, LiveKit voice. Syncthing's web GUI is
# NOT exposed: it listens on 127.0.0.1 only and is reached through an SSH tunnel.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Never log the query string or credentials: a URL like /cockpit?token=… would
    # otherwise be written to disk in clear. $uri is the path only.
    log_format main '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript image/svg+xml;

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=webhook:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=login:10m rate=20r/m;
    # n8n's editor fires dozens of requests per page; the login zone (20r/m) returned 429 for it.
    limit_req_zone $binary_remote_addr zone=n8n:10m rate=600r/m;
    limit_req_status 429;

    upstream eva_agent {
        server eva-agent:8000;
        keepalive 32;
    }

    upstream n8n_backend {
        server n8n:5678;
        keepalive 16;
    }

    # LiveKit lives in an optional overlay (deploy/docker-compose.voice.yml). It is
    # resolved at request time through Docker's DNS so nginx still starts when the
    # voice stack is down (a static upstream would abort the whole proxy).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Common SSL settings
    ssl_certificate /etc/nginx/certs/live/default/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/default/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # HTTP -> HTTPS redirect (only for our own hostnames; strangers get nothing)
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }

    server {
        listen 80;
        server_name syndicateholding.com www.syndicateholding.com n8n.syndicateholding.com voice.syndicateholding.com;
        return 301 https://$host$request_uri;
    }

    # Anything that reaches 443 with an unknown Host header (scanners hitting the
    # bare IP, wrong SNI) is dropped instead of being served the cockpit.
    server {
        listen 443 ssl default_server;
        server_name _;
        return 444;
    }

    # 1. n8n (n8n.syndicateholding.com) — protected by n8n's own owner login
    server {
        listen 443 ssl;
        http2 on;
        server_name n8n.syndicateholding.com;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=63072000" always;

        # Password guessing stays slow: the editor itself is not rate limited this way.
        location = /rest/login {
            limit_req zone=login burst=10 nodelay;
            proxy_pass http://n8n_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            limit_req zone=n8n burst=300 nodelay;
            proxy_pass http://n8n_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }
    }

    # 2. LiveKit signalling (voice.syndicateholding.com). Every connection needs a
    #    JWT signed with LIVEKIT_API_SECRET; the keys are mandatory (see compose).
    server {
        listen 443 ssl;
        http2 on;
        server_name voice.syndicateholding.com;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000" always;

        location / {
            limit_req zone=login burst=60 nodelay;
            set $livekit_upstream http://syndicate-livekit:7880;
            proxy_pass $livekit_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }

    # 3. Obsidian sync hub (operator 29.10): Garage's S3 API for the Remotely Save
    #    plugin on Andrii's PC and phone. Only the obsidian-devices key (bucket
    #    obsidian-vault) is meant to be used here; every request is SigV4-signed,
    #    so Host must reach Garage unchanged. Syncthing was retired.
    server {
        listen 443 ssl;
        http2 on;
        server_name sync.syndicateholding.com;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000" always;

        client_max_body_size 100m;          # Cloudflare's own per-request cap
        proxy_request_buffering off;

        location / {
            proxy_pass http://garage:3900;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_connect_timeout 5s;
        }
    }

    # 4. Executive Cockpit + agent API (syndicateholding.com)
    server {
        listen 443 ssl;
        http2 on;
        server_name syndicateholding.com www.syndicateholding.com;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(self), camera=()" always;
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

        location /webhook/ {
            limit_req zone=webhook burst=20 nodelay;
            proxy_pass http://eva_agent/webhook/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }

        location /api/ {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://eva_agent/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-API-Key $http_x_api_key;
            proxy_read_timeout 120s;
            # SSE (/api/execute/stream, /api/cr/stream) must not be buffered.
            proxy_buffering off;
        }

        location /assets/ {
            alias /usr/share/nginx/static/assets/;
            add_header Cache-Control "public, max-age=604800, immutable" always;
            access_log off;
        }

        # Executive cockpit UI — served by the agent, which enforces Basic auth
        # (username "device") before sending a byte.
        location = /cockpit {
            limit_req zone=login burst=10 nodelay;
            proxy_pass http://eva_agent/cockpit;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-API-Key $http_x_api_key;
            proxy_read_timeout 30s;
        }

        location /cockpit/ {
            return 404;
        }

        location = / {
            limit_req zone=login burst=10 nodelay;
            proxy_pass http://eva_agent/cockpit;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-API-Key $http_x_api_key;
            proxy_read_timeout 30s;
        }

        # Read-only data the cockpit renders (auth enforced by the agent).
        location = /directors {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://eva_agent/directors;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-API-Key $http_x_api_key;
            proxy_read_timeout 30s;
        }

        location = /floors {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://eva_agent/floors;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-API-Key $http_x_api_key;
            proxy_read_timeout 30s;
        }

        location = /admin/lockdown {
            limit_req zone=api burst=5 nodelay;
            proxy_pass http://eva_agent/admin/lockdown;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-API-Key $http_x_api_key;
        }

        location /hitl/ {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://eva_agent/hitl/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-API-Key $http_x_api_key;
        }

        location = /health {
            proxy_pass http://eva_agent/health;
            access_log off;
        }

        location ~ /\. {
            deny all;
        }
    }
}

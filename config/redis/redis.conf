# Redis 7 configuration for EVA SYNDICATE

# Network
bind 0.0.0.0
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Authentication (password set via requirepass)
requirepass REDIS_PASSWORD_PLACEHOLDER
# Note: actual password injected via environment at startup — see deploy/scripts/redis_init.sh

# Memory management
maxmemory 512mb
maxmemory-policy allkeys-lru

# Persistence (RDB snapshots)
save 3600 1
save 300 100
save 60 10000
dbfilename dump.rdb
dir /data

# AOF persistence
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Logging
loglevel notice
logfile ""

# Security
protected-mode yes
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG "CONFIG_RESTRICTED"
rename-command DEBUG ""
rename-command EVAL ""

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Latency monitoring
latency-monitor-threshold 100

# Production Redis Configuration for EVA SYNDICATE
#
# SECURITY: the password is deliberately NOT stored in this file. Compose reads
# ${REDIS_PASSWORD} from .env and passes it as `--requirepass` on the command line
# (see deploy/docker-compose.yml), so there is no placeholder to "synchronise"
# before a deploy and no secret at rest here. The healthcheck authenticates the
# same way. Verify on the server:
#     redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping   ->  PONG
#     redis-cli ping                                          ->  NOAUTH ...
bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300
daemonize no
loglevel notice
databases 16

# Snapshotting (RDB)
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Danger-command lockdown. No component of the syndicate uses these, and they are
# the first thing an attacker who reaches the port tries. Renaming to an empty
# string disables the command completely.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command DEBUG ""
rename-command EVAL ""

# Memory Management
maxmemory 512mb
maxmemory-policy allkeys-lru

# Persistence (AOF)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

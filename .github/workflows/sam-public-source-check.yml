name: Sam public source check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/sam_public_sources.py
      - tools/sam_source_check.py

permissions:
  contents: read

jobs:
  public-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "httpx>=0.27,<1" "structlog>=24,<27"
      - name: Query public providers without any account
        run: python -m tools.sam_source_check

<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AquaVoice Syndicate — Voice Input Cockpit</title>
<style>
  :root {
    --bg-color: #080c14;
    --card-bg: rgba(15, 23, 42, 0.75);
    --border-color: rgba(56, 189, 248, 0.2);
    --accent-blue: #0284c7;
    --accent-cyan: #38bdf8;
    --glow-cyan: rgba(56, 189, 248, 0.4);
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }

  body {
    background-color: var(--bg-color);
    background-image: radial-gradient(circle at 50% 20%, rgba(14, 165, 233, 0.12) 0%, transparent 60%);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
  }

  .container {
    width: 100%;
    max-width: 780px;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 24px;
    padding: 36px;
    backdrop-filter: blur(20px);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px var(--glow-cyan);
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }

  .badge {
    background: rgba(14, 165, 233, 0.15);
    border: 1px solid var(--border-color);
    padding: 6px 16px;
    border-radius: 9999px;
    font-size: 11px;
    letter-spacing: 1.5px;
    font-weight: 700;
    color: var(--accent-cyan);
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  h1 {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin-bottom: 8px;
    text-align: center;
    background: linear-gradient(135deg, #ffffff 40%, #7dd3fc 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle {
    color: var(--text-secondary);
    font-size: 14px;
    margin-bottom: 30px;
    text-align: center;
  }

  /* Audio Orb Canvas */
  .orb-wrapper {
    position: relative;
    width: 180px;
    height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 25px;
  }

  canvas#waveform {
    width: 180px;
    height: 180px;
    border-radius: 50%;
  }

  .mic-button {
    position: absolute;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
    border: 2px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 0 25px var(--glow-cyan);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    outline: none;
  }

  .mic-button:hover {
    transform: scale(1.06);
    box-shadow: 0 0 35px var(--accent-cyan);
  }

  .mic-button.recording {
    background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
    box-shadow: 0 0 40px rgba(239, 68, 68, 0.6);
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0% { transform: scale(1); box-shadow: 0 0 25px rgba(239, 68, 68, 0.5); }
    50% { transform: scale(1.08); box-shadow: 0 0 45px rgba(239, 68, 68, 0.9); }
    100% { transform: scale(1); box-shadow: 0 0 25px rgba(239, 68, 68, 0.5); }
  }

  .mic-icon {
    width: 36px;
    height: 36px;
    fill: #ffffff;
  }

  .hotkey-hint {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 25px;
  }

  .kbd {
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 6px;
    padding: 3px 8px;
    font-size: 11px;
    font-weight: 700;
    color: #ffffff;
    box-shadow: 0 2px 0 rgba(0, 0, 0, 0.3);
  }

  /* Output Textbox */
  .output-box {
    width: 100%;
    min-height: 120px;
    background: rgba(2, 6, 23, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px;
    padding: 16px 20px;
    font-size: 15px;
    line-height: 1.6;
    color: #e2e8f0;
    resize: vertical;
    outline: none;
    margin-bottom: 18px;
    transition: border 0.2s;
  }

  .output-box:focus {
    border-color: var(--accent-cyan);
  }

  /* Controls row */
  .controls-row {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }

  .mode-selector {
    display: flex;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    padding: 3px;
  }

  .mode-btn {
    background: transparent;
    border: none;
    padding: 6px 14px;
    border-radius: 9px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.2s;
  }

  .mode-btn.active {
    background: var(--accent-blue);
    color: #ffffff;
  }

  .action-btn {
    background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
    border: none;
    padding: 10px 22px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 700;
    color: #ffffff;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .action-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 5px 20px rgba(14, 165, 233, 0.4);
  }

  .status-text {
    font-size: 12px;
    color: var(--accent-cyan);
    margin-top: 10px;
    height: 16px;
  }
</style>
</head>
<body>

<div class="container">
  <div class="badge">AQUAVOICE CLONE • СИНДИКАТ EDITION</div>
  <h1>Говоріть замість того, щоб друкувати</h1>
  <p class="subtitle">Миттєве розпізнавання мови, автоформатування коду та передача тексту в Antigravity</p>

  <div class="orb-wrapper">
    <canvas id="waveform" width="180" height="180"></canvas>
    <button class="mic-button" id="micBtn" title="Натисніть або затисніть Пробіл">
      <svg class="mic-icon" viewBox="0 0 24 24">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
      </svg>
    </button>
  </div>

  <div class="hotkey-hint">
    Утримуйте <span class="kbd">Space</span> або натисніть кнопку для запису
  </div>

  <textarea class="output-box" id="outputBox" placeholder="Тут з'явиться ваш розпізнаний текст... Говоріть українською або англійською, диктуйте код чи промпти."></textarea>

  <div class="controls-row">
    <div class="mode-selector">
      <button class="mode-btn active" id="langUa" onclick="setLang('uk-UA')">UA</button>
      <button class="mode-btn" id="langEn" onclick="setLang('en-US')">EN</button>
      <button class="mode-btn" id="modeCode" onclick="toggleCodeMode()">Code Prompt</button>
    </div>

    <button class="action-btn" onclick="copyText()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
      </svg>
      Копіювати текст
    </button>
  </div>

  <div class="status-text" id="statusText">Готовий до роботи</div>
</div>

<script>
  let isRecording = false;
  let recognition = null;
  let currentLang = 'uk-UA';
  let isCodeMode = false;
  const micBtn = document.getElementById('micBtn');
  const outputBox = document.getElementById('outputBox');
  const statusText = document.getElementById('statusText');
  const canvas = document.getElementById('waveform');
  const ctx = canvas.getContext('2d');

  // Waveform animation
  let animationId;
  function drawIdle() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.beginPath();
    ctx.arc(90, 90, 80, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(56, 189, 248, 0.2)";
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  drawIdle();

  function animateWaveform() {
    if (!isRecording) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const time = Date.now() * 0.005;
    ctx.beginPath();
    for (let i = 0; i < 360; i += 5) {
      const angle = (i * Math.PI) / 180;
      const wave = Math.sin(angle * 6 + time) * 12 + Math.cos(angle * 4 - time) * 8;
      const r = 70 + wave;
      const x = 90 + r * Math.cos(angle);
      const y = 90 + r * Math.sin(angle);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = "rgba(56, 189, 248, 0.7)";
    ctx.lineWidth = 3;
    ctx.stroke();
    animationId = requestAnimationFrame(animateWaveform);
  }

  // Web Speech API
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = currentLang;

    recognition.onresult = (event) => {
      let interim = '';
      let final = '';
      for (let i = event.resultIndex; i < event.results.length; ++i) {
        if (event.results[i].isFinal) {
          final += event.results[i][0].transcript;
        } else {
          interim += event.results[i][0].transcript;
        }
      }
      if (final) {
        let textToAppend = formatText(final);
        outputBox.value += (outputBox.value ? ' ' : '') + textToAppend;
      }
      statusText.innerText = interim ? `... ${interim}` : "Запис триває...";
    };

    recognition.onerror = (e) => {
      statusText.innerText = `Помилка мікрофона: ${e.error}`;
      stopRecord();
    };

    recognition.onend = () => {
      if (isRecording) stopRecord();
    };
  } else {
    statusText.innerText = "Ваш браузер не підтримує Web Speech API. Використовуйте Chrome або Edge.";
  }

  function startRecord() {
    if (isRecording) return;
    isRecording = true;
    micBtn.classList.add('recording');
    statusText.innerText = "Слухаю... Говоріть!";
    animateWaveform();
    if (recognition) {
      recognition.lang = currentLang;
      try { recognition.start(); } catch(e){}
    }
  }

  function stopRecord() {
    if (!isRecording) return;
    isRecording = false;
    micBtn.classList.remove('recording');
    statusText.innerText = "Запис завершено.";
    cancelAnimationFrame(animationId);
    drawIdle();
    if (recognition) {
      try { recognition.stop(); } catch(e){}
    }
  }

  micBtn.addEventListener('click', () => {
    if (isRecording) stopRecord();
    else startRecord();
  });

  // Hold Space to talk
  let spacePressed = false;
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && !spacePressed && document.activeElement !== outputBox) {
      spacePressed = true;
      e.preventDefault();
      startRecord();
    }
  });

  window.addEventListener('keyup', (e) => {
    if (e.code === 'Space' && spacePressed && document.activeElement !== outputBox) {
      spacePressed = false;
      e.preventDefault();
      stopRecord();
    }
  });

  function setLang(lang) {
    currentLang = lang;
    document.getElementById('langUa').classList.toggle('active', lang === 'uk-UA');
    document.getElementById('langEn').classList.toggle('active', lang === 'en-US');
    if (recognition) recognition.lang = currentLang;
    statusText.innerText = `Мову перемкнено на: ${lang === 'uk-UA' ? 'Українську' : 'English'}`;
  }

  function toggleCodeMode() {
    isCodeMode = !isCodeMode;
    document.getElementById('modeCode').classList.toggle('active', isCodeMode);
    statusText.innerText = `Режим коду: ${isCodeMode ? 'УВІМКНЕНО' : 'ВИМКНЕНО'}`;
  }

  function formatText(text) {
    let t = text.trim();
    if (isCodeMode) {
      // Automatic formatting for code terms
      t = t.replace(/\bфункція\b/gi, 'function')
           .replace(/\bклас\b/gi, 'class')
           .replace(/\bімпорт\b/gi, 'import')
           .replace(/\bповернути\b/gi, 'return');
    }
    return t;
  }

  function copyText() {
    outputBox.select();
    navigator.clipboard.writeText(outputBox.value);
    statusText.innerText = "✅ Скопійовано в буфер обміну!";
    setTimeout(() => { statusText.innerText = "Готовий до роботи"; }, 2500);
  }
</script>
</body>
</html>

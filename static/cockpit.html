<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SYNDIKAT — Executive Cockpit (SYNDICATE HOLDING)</title>
<style>
  :root { --bg:#0b0e14; --panel:#131824; --line:#232b3d; --fg:#e6e9f0; --mut:#8a93a8; --ok:#3ecf8e; --warn:#f5a524; --bad:#ef4444; --acc:#6ea8fe; }
  @media (prefers-color-scheme: light) { :root { --bg:#f5f6f9; --panel:#fff; --line:#d9deea; --fg:#141824; --mut:#5d667b; --acc:#1d5fd1; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; }
  h1 { font-size:16px; margin:0; letter-spacing:.04em; }
  h2 { font-size:13px; margin:0 0 10px; text-transform:uppercase; letter-spacing:.08em; color:var(--mut); }
  main { padding:16px; display:grid; gap:16px; max-width:1200px; margin:0 auto; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  input { background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:7px 9px; min-width:220px; }
  button { background:var(--acc); color:#fff; border:0; border-radius:6px; padding:7px 12px; cursor:pointer; font-weight:600; }
  button.ghost { background:transparent; color:var(--fg); border:1px solid var(--line); }
  button.ok { background:var(--ok); color:#06210f; } button.bad { background:var(--bad); }
  button.panic { background:var(--bad); font-size:14px; padding:9px 16px; }
  button:disabled { opacity:.5; cursor:default; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:10px; }
  .card { border:1px solid var(--line); border-radius:8px; padding:10px; }
  .card b { display:block; } .mut { color:var(--mut); font-size:12px; }
  .tag { display:inline-block; font-size:11px; padding:1px 7px; border-radius:99px; border:1px solid var(--line); margin:4px 4px 0 0; }
  .tag.ok { color:var(--ok); border-color:var(--ok); } .tag.bad { color:var(--bad); border-color:var(--bad); } .tag.warn { color:var(--warn); border-color:var(--warn); }
  .banner { display:none; padding:10px 16px; background:var(--bad); color:#fff; font-weight:700; }
  .item { border-top:1px solid var(--line); padding:10px 0; } .item:first-child { border-top:0; }
  pre { margin:6px 0 0; white-space:pre-wrap; word-break:break-word; font-size:12px; color:var(--mut); }
  #msg { min-height:1.4em; } .err { color:var(--bad); }
</style>
</head>
<body>
<div id="lockbanner" class="banner">⛔ LOCKDOWN УВІМКНЕНО — всі записуючі запити заблоковані. Зняти можна лише на сервері (tools/unlock_lockdown.py).</div>
<header>
  <h1>SYNDIKAT · SYNDICATE HOLDING — Executive Cockpit</h1>
  <div class="row">
    <input id="key" type="password" autocomplete="off" placeholder="Ключ оператора (лише в цій вкладці)">
    <button class="ghost" id="saveKey">Зберегти</button>
    <button class="ghost" id="reload">Оновити</button>
    <button class="panic" id="panic">PANIC STOP</button>
  </div>
</header>
<main>
  <div id="msg" class="mut" role="status"></div>
  <section><h2>Система</h2><div id="health" class="row mut">завантаження…</div></section>
  <section><h2>Директори (<span id="dcount">0</span>)</h2><div id="directors" class="grid"></div></section>
  <section><h2>Черга HITL — утримані дії</h2><div id="hitl" class="mut">завантаження…</div></section>
  <section><h2>Запити на зміни (CR)</h2><div id="crs" class="mut">завантаження…</div></section>
</main>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var KEY = "";
  try { KEY = sessionStorage.getItem("op_key") || ""; } catch (e) {}
  $("key").value = KEY;

  function say(text, isErr) { var m = $("msg"); m.textContent = text || ""; m.className = isErr ? "err" : "mut"; }
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function tag(text, kind) { return el("span", "tag" + (kind ? " " + kind : ""), text); }

  // Same-origin only. Browser Basic credentials cover reads; writes use the operator key.
  function call(method, path, body) {
    var headers = { "Accept": "application/json" };
    if (KEY) headers["X-API-Key"] = KEY;
    if (body) headers["Content-Type"] = "application/json";
    return fetch(path, { method: method, headers: headers, body: body ? JSON.stringify(body) : undefined, credentials: "same-origin" })
      .then(function (r) {
        return r.text().then(function (t) {
          var data = null; try { data = t ? JSON.parse(t) : null; } catch (e) {}
          if (!r.ok) { var err = new Error((data && (data.detail || data.error || data.status)) || ("HTTP " + r.status)); err.status = r.status; throw err; }
          return data;
        });
      });
  }

  function renderHealth(h) {
    var box = $("health"); box.textContent = "";
    if (!h) { box.textContent = "недоступно"; return; }
    Object.keys(h).forEach(function (k) {
      var v = h[k]; if (v !== null && typeof v === "object") v = JSON.stringify(v);
      box.appendChild(tag(k + ": " + v, (v === true || v === "ok" || v === "healthy") ? "ok" : ""));
    });
  }

  function renderDirectors(d) {
    var box = $("directors"); box.textContent = "";
    var list = (d && d.directors) || [];
    $("dcount").textContent = String(list.length);
    list.forEach(function (x) {
      var c = el("div", "card");
      c.appendChild(el("b", null, x.name + " · " + x.id));
      c.appendChild(el("div", "mut", x.role));
      c.appendChild(el("div", "mut", (x.wing || "") + (x.bot_handle ? " · " + x.bot_handle : "")));
      c.appendChild(tag(x.bot_configured ? "Telegram-бот: токен є" : "Telegram-бот: токена немає", x.bot_configured ? "ok" : "warn"));
      c.appendChild(tag(x.enabled === true ? "увімкнено" : x.enabled === false ? "вимкнено" : "стан невідомо", x.enabled === true ? "ok" : ""));
      c.appendChild(tag(x.runtime || "", ""));
      box.appendChild(c);
    });
  }

  function decideHitl(id, decision) {
    call("POST", "/hitl/decide", { item_id: id, decision: decision }).then(function () {
      if (decision !== "approve") { say("Відхилено: " + id); return load(); }
      return call("POST", "/hitl/release/" + encodeURIComponent(id)).then(function (r) {
        say("Схвалено. Звільнено дій: " + ((r && r.released_actions) || []).length + ". Виконання — через відповідного агента, не тут.");
        return load();
      });
    }).catch(function (e) { say("Не вдалося: " + e.message, true); });
  }

  function renderHitl(d) {
    var box = $("hitl"); box.textContent = "";
    var items = (d && d.pending) || [];
    if (!items.length) { box.textContent = "Порожньо — нічого не чекає на рішення."; return; }
    items.forEach(function (i) {
      var row = el("div", "item");
      row.appendChild(el("b", null, i.id + " · " + i.agent_id + " · " + i.task_type));
      row.appendChild(el("div", "mut", i.reason + " (дій утримано: " + i.held_actions_count + ", " + i.created_at + ")"));
      var a = el("div", "row"), ok = el("button", "ok", "Схвалити"), no = el("button", "bad", "Відхилити");
      ok.onclick = function () { decideHitl(i.id, "approve"); };
      no.onclick = function () { decideHitl(i.id, "reject"); };
      a.appendChild(ok); a.appendChild(no); row.appendChild(a); box.appendChild(row);
    });
  }

  function decideCr(id, decision) {
    call("POST", "/api/cr/review", { cr_id: id, decision: decision }).then(function () { say("CR " + id + ": " + decision); return load(); })
      .catch(function (e) { say("Не вдалося: " + e.message, true); });
  }

  function renderCrs(d) {
    var box = $("crs"); box.textContent = "";
    var items = (d && (d.pending || d.change_requests)) || [];
    if (!items.length) { box.textContent = "Немає запитів, що очікують."; return; }
    items.forEach(function (c) {
      var id = c.cr_id || c.id;
      var row = el("div", "item");
      row.appendChild(el("b", null, id + " · " + (c.title || c.summary || c.agent_id || "")));
      var pre = el("pre", null, JSON.stringify(c, null, 2).slice(0, 1500)); row.appendChild(pre);
      var a = el("div", "row"), ok = el("button", "ok", "Схвалити"), no = el("button", "bad", "Відхилити");
      ok.onclick = function () { decideCr(id, "approve"); };
      no.onclick = function () { decideCr(id, "reject"); };
      a.appendChild(ok); a.appendChild(no); row.appendChild(a); box.appendChild(row);
    });
  }

  function section(promise, render, box) {
    return promise.then(render).catch(function (e) {
      var n = $(box); n.textContent = ""; n.appendChild(el("span", "err", "недоступно: " + e.message));
    });
  }

  function load() {
    say("");
    return Promise.all([
      section(call("GET", "/health"), renderHealth, "health"),
      section(call("GET", "/directors"), renderDirectors, "directors"),
      section(call("GET", "/hitl/pending"), renderHitl, "hitl"),
      section(call("GET", "/api/cr/pending"), renderCrs, "crs"),
      call("GET", "/admin/lockdown").then(function (l) { $("lockbanner").style.display = l && l.locked ? "block" : "none"; }).catch(function () {})
    ]);
  }

  $("saveKey").onclick = function () {
    KEY = $("key").value.trim();
    try { sessionStorage.setItem("op_key", KEY); } catch (e) {}
    say("Ключ збережено для цієї вкладки."); load();
  };
  $("reload").onclick = load;
  $("panic").onclick = function () {
    if (!window.confirm("Увімкнути LOCKDOWN? Усі записуючі запити буде заблоковано до розблокування на сервері.")) return;
    call("POST", "/admin/lockdown", { reason: "cockpit panic stop" })
      .then(function () { say("LOCKDOWN увімкнено."); return load(); })
      .catch(function (e) { say("LOCKDOWN НЕ увімкнено: " + e.message, true); });
  };
  load();
})();
</script>
</body>
</html>
